name: Build and Release WASM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EMSDK_PATH: ${{ github.workspace }}/emsdk
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential python3
          git clone https://github.com/emscripten-core/emsdk.git $EMSDK_PATH
          $EMSDK_PATH/emsdk install latest
          $EMSDK_PATH/emsdk activate latest

      - name: Cache Emscripten
        uses: actions/cache@v3
        with:
          path: ${{ env.EMSDK_PATH }}
          key: emscripten-${{ hashFiles('emsdk/emsdk.py') }}        

      - name: Build WASM
        run: |
          source $EMSDK_PATH/emsdk_env.sh
          emcc src/*.c extras/custom_printf.c -I src/include \
          -o corelox.mjs \
          -s MODULARIZE=1 \
          -s EXPORT_ES6=1 \
          -s ENVIRONMENT=web \
          -s WASM=1 \
          -s EXPORTED_FUNCTIONS='["_run_lox","_get_output","_malloc","_free"]' \
          -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' --exclude-file=src/main.c


      - name: Archive WASM outputs
        run: |
          mkdir wasm-artifacts
          mv corelox.mjs corelox.wasm wasm-artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: corelox-wasm
          path: wasm-artifacts

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: corelox-wasm

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GH_TOKEN }}
          tag: ${{ github.ref_name }}
          name: "CoreLox WASM Release - ${{ github.ref_name }}"
          body: |
            Automated release for CoreLox WASM artifacts.

      - name: Dispatch to Playground
        uses: peter-evans/repository-dispatch@v2
        with:
            token: ${{ secrets.GH_TOKEN }}
            repository: mvishiu11/lox-playground
            event-type: corelox-release
            client-payload: |
             {
             "corelox_version": "${{ github.ref }}",
             "release_tag": "${{ github.event.release.tag_name }}"
             }